[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-predictor"
version = "0.1.0"
description = "A transparent football prediction and betting-decision engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
sports-predictor = "sports_predictor.cli:main"
sports-predictor-mcp = "sports_predictor.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
